name: Scheduled verification

on:
  schedule:
    - cron: '0 0 1 * *'  # 1st of each month, 00:00 UTC
  workflow_dispatch:

jobs:
  verify-sources:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Verify source URLs
        id: verify
        run: python scripts/verify_sources.py

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[scheduled] Source URL check failed (${today})`,
              body: [
                'The scheduled `verify_sources.py` run failed.',
                '',
                `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                'Check the workflow logs for the list of broken URLs and which entries reference them.',
              ].join('\n'),
              labels: ['source-check', 'automated']
            });
