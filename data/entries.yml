# Prompt 辭典單一資料源
# 編輯這個檔案後請執行 `python scripts/build.py` 重新生成 DICTIONARY.md 與 QUICK-REFERENCE.md
# 結構說明見 schemas/entry.schema.json

categories:
  structure:
    name: 結構與系統
    order: 1
    default_source:
      name: SEVOCAB (ISO/IEC/IEEE 24765)
      url: https://www.computer.org/sevocab
  logic:
    name: 邏輯與推理
    order: 2
    default_source:
      name: Stanford Encyclopedia of Philosophy
      url: https://plato.stanford.edu/
  cognition:
    name: 思考與認知
    order: 3
    default_source:
      name: APA Dictionary of Psychology
      url: https://dictionary.apa.org/
  language:
    name: 語言與表達
    order: 4
    default_source:
      name: David Crystal, A Dictionary of Linguistics and Phonetics
      url: null
  quality:
    name: 品質與檢查
    order: 5
    default_source:
      name: ISTQB Glossary
      url: https://glossary.istqb.org/

entries:
  # ===== 一、結構與系統 =====
  - term: 內聚
    english: Cohesion
    slug: cohesion
    category: structure
    origin: 軟體工程（Constantine, 1974）
    meaning: 模組內部元素彼此關聯的緊密程度
    prompt_usage: 要求 AI 輸出的每個段落/章節只談一件事、職責集中
    short_usage: 要求每個段落只談一件事
    example: 請以高**內聚**原則撰寫這份文件，每個小節只處理單一主題。
    added: "2026-05-26"
    last_verified: "2026-05-26"

  - term: 不變性
    english: Invariance
    slug: invariance
    category: structure
    origin: 數學、函數式程式設計
    meaning: 某性質在操作前後恆保持不變
    prompt_usage: 要求 AI 在改寫/重構時保持某些核心條件不被破壞
    short_usage: 要求改寫時保留事實與數字
    example: 請保留原文的**不變性**：事實、數字、人名一律不得更動，只能調整語句。
    added: "2026-05-26"
    last_verified: "2026-05-26"

  - term: 介面
    english: Interface
    slug: interface
    category: structure
    origin: 軟體工程、物件導向
    meaning: 兩個系統之間的契約與互動規範
    prompt_usage: 要求 AI 明確界定輸入/輸出格式、不要把實作細節漏出來
    short_usage: 要求先界定輸入輸出格式
    example: 請先定義這個流程的**介面**（輸入、輸出、前後條件）再開始細節。
    added: "2026-05-26"
    last_verified: "2026-05-26"

  - term: 可重現性
    english: Reproducibility
    slug: reproducibility
    category: structure
    origin: 科學研究、實驗方法學
    meaning: 在相同條件下他人能重複得到相同結果
    prompt_usage: 要求 AI 給出的步驟讓別人照做也能得到一樣的產出
    short_usage: 要求步驟讓他人照做也能複現
    example: 請以**可重現性**為目標撰寫步驟，任何人照做都應得到相同結果。
    added: "2026-05-26"
    last_verified: "2026-05-26"

  - term: 可觀測性
    english: Observability
    slug: observability
    category: structure
    origin: 控制理論、SRE
    meaning: 從外部輸出能推斷系統內部狀態的程度
    prompt_usage: 要求 AI 在流程中加入記錄、檢查點、可被外部驗證的訊號
    short_usage: 要求流程加入可驗證的檢查點
    example: 請為這個流程加入**可觀測性**設計，每個關鍵步驟都要有可查驗的輸出。
    added: "2026-05-26"
    last_verified: "2026-05-26"

  - term: 正交性
    english: Orthogonality
    slug: orthogonality
    category: structure
    origin: 線性代數、軟體工程
    meaning: 兩個元素彼此獨立、改動一者不影響另一者
    prompt_usage: 要求 AI 拆解時各部分互不耦合、可獨立調整
    short_usage: 要求各部分互不耦合可獨立調整
    example: 請以**正交性**原則拆分這份計畫，每個維度可獨立調整不互相牽動。
    added: "2026-05-26"
    last_verified: "2026-05-26"

  - term: 副作用
    english: Side Effect
    slug: side-effect
    category: structure
    origin: 函數式程式設計
    meaning: 操作除了回傳值之外、對外部狀態造成的額外影響
    prompt_usage: 要求 AI 明確列出某動作的隱性影響、或避免產生副作用
    short_usage: 要求列出隱性影響或避免之
    example: 請列出這個修改可能造成的**副作用**，特別是對其他模組的隱性影響。
    added: "2026-05-26"
    last_verified: "2026-05-26"

  - term: 抽象層次
    english: Abstraction Level
    slug: abstraction-level
    category: structure
    origin: 軟體工程、系統設計
    meaning: 陳述細節粗細的階層位置
    prompt_usage: 要求 AI 在指定的抽象層級講話、不要混用不同顆粒度
    short_usage: 要求陳述顆粒度保持一致
    example: 請保持同一**抽象層次**陳述，不要時而談架構時而談變數命名。
    added: "2026-05-26"
    last_verified: "2026-05-26"

  - term: 封裝
    english: Encapsulation
    slug: encapsulation
    category: structure
    origin: 物件導向程式設計
    meaning: 把實作細節藏在介面背後、外部只看到必要的部分
    prompt_usage: 要求 AI 把複雜邏輯包起來、對外只給簡潔的入口
    short_usage: 要求把細節藏起來只露入口
    example: 請將內部細節**封裝**起來，對外只暴露最少必要的呼叫方式。
    added: "2026-05-26"
    last_verified: "2026-05-26"

  - term: 耦合
    english: Coupling
    slug: coupling
    category: structure
    origin: 軟體工程（Constantine, 1974）
    meaning: 模組之間相互依賴的程度
    prompt_usage: 要求 AI 降低各部分的相互依賴、或指出哪些地方耦合過高
    short_usage: 要求降低或檢查相互依賴
    example: 請檢查這份設計的**耦合**度，找出修改 A 就會牽動 B 的環節。
    added: "2026-05-26"
    last_verified: "2026-05-26"

  - term: 原子性
    english: Atomicity
    slug: atomicity
    category: structure
    origin: 資料庫交易、軟體設計
    meaning: 不可再分割、要麼全做、要麼全不做
    prompt_usage: 要求把任務拆到不能再分的最小單位、或要求每個輸出獨立可驗證
    short_usage: 要求把任務拆到最小單位
    example: 請以**原子性**原則拆解這個需求，每一步驟必須獨立可執行。
    added: "2026-05-26"
    last_verified: "2026-05-26"

  - term: 確定性
    english: Determinism
    slug: determinism
    category: structure
    origin: 計算理論、形式驗證
    meaning: 給定相同輸入必定產生相同輸出、無隨機性
    prompt_usage: 要求 AI 給出明確答案、不要含糊、不要「視情況而定」
    short_usage: 要求給出明確答案不要含糊
    example: 請以**確定性**回答這個問題，給出明確結論而非條件式回應。
    added: "2026-05-26"
    last_verified: "2026-05-26"

  - term: 解耦
    english: Decoupling
    slug: decoupling
    category: structure
    origin: 軟體工程
    meaning: 主動降低或切斷模組之間的依賴
    prompt_usage: 要求 AI 把目前糾纏在一起的概念/流程拆開
    short_usage: 要求把糾纏概念拆開
    example: 請把流程裡的資料處理與通知邏輯**解耦**，分成兩個獨立段落。
    added: "2026-05-26"
    last_verified: "2026-05-26"

  - term: 模組化
    english: Modularization
    slug: modularization
    category: structure
    origin: 軟體工程
    meaning: 將整體拆成可獨立使用、替換的模組
    prompt_usage: 要求 AI 輸出可被切片使用的段落、不要黏成一坨
    short_usage: 要求輸出可被切片獨立使用
    example: 請**模組化**地撰寫這份指南，讀者可只取其中一節單獨使用。
    added: "2026-05-26"
    last_verified: "2026-05-26"

  - term: 冪等性
    english: Idempotency
    slug: idempotency
    category: structure
    origin: 數學、API 設計
    meaning: 同一操作執行多次與執行一次效果相同
    prompt_usage: 要求 AI 產出的 SOP、指令、流程「重複跑也不出錯」
    short_usage: 要求流程重複跑也不出錯
    example: 請以**冪等性**原則撰寫這份還原流程，確保腳本重跑不會造成資料不一致。
    added: "2026-05-26"
    last_verified: "2026-05-26"

  - term: 單一職責
    english: Single Responsibility
    slug: single-responsibility
    category: structure
    origin: 物件導向設計（SOLID 之首）
    meaning: 每個單元只承擔一項職責、只有一個改變的理由
    prompt_usage: 要求 AI 拆分時每個段落/函數/章節只負責一件事
    short_usage: 要求每個段落只負責一件事
    example: 請依**單一職責**原則重組這份提案，每段只回答一個問題。
    added: "2026-05-26"
    last_verified: "2026-05-26"

  - term: 顆粒度
    english: Granularity
    slug: granularity
    category: structure
    origin: 軟體工程、資料倉儲
    meaning: 劃分的精細程度
    prompt_usage: 要求 AI 用指定的粗細程度展開、避免過粗或過細
    short_usage: 要求用指定粗細程度展開
    example: 請以中等**顆粒度**展開計畫，不要細到動作層、也不要粗到只剩目標。
    added: "2026-05-26"
    last_verified: "2026-05-26"

  - term: E2E
    english: End-to-end
    slug: e2e
    category: structure
    origin: 軟體測試、網路通訊
    meaning: 從起點到終點、涵蓋整條鏈路的完整視角
    prompt_usage: 要求 AI 從使用者第一個動作講到最後一個結果、不要只看片段
    short_usage: 要求從頭到尾講完整條鏈路
    example: 請以 **E2E** 視角描述這個流程，從使用者按下按鈕到收到結果為止。
    added: "2026-05-26"
    last_verified: "2026-05-26"

  # ===== 二、邏輯與推理 =====
  - term: 三段論
    english: Syllogism
    slug: syllogism
    category: logic
    origin: 亞里斯多德邏輯學
    meaning: 由大前提、小前提、推出結論的演繹結構
    prompt_usage: 要求 AI 用「前提 → 前提 → 結論」的標準格式呈現推理
    short_usage: 要求用前提前提結論的格式呈現
    example: 請用**三段論**結構展示這個論證，清楚標出兩個前提與結論。
    added: "2026-05-26"
    last_verified: "2026-05-26"

  - term: 反例
    english: Counterexample
    slug: counterexample
    category: logic
    origin: 數學、邏輯學
    meaning: 能推翻一個普遍命題的單一具體案例
    prompt_usage: 要求 AI 主動找出能打破自己論點的案例
    short_usage: 要求主動找能打破論點的案例
    example: 請為你剛才的結論提出**反例**，若找不到反例再說明為何普遍成立。
    added: "2026-05-26"
    last_verified: "2026-05-26"

  - term: 反證
    english: Reductio ad Absurdum
    slug: reductio-ad-absurdum
    category: logic
    origin: 古希臘邏輯學
    meaning: 假設反面為真、推出矛盾、從而證明原命題為真
    prompt_usage: 要求 AI 用「假設不成立 → 推出荒謬」的方式論證
    short_usage: 要求假設反面成立並導出矛盾
    example: 請用**反證**法證明這個結論，先假設它為假再導出矛盾。
    added: "2026-05-26"
    last_verified: "2026-05-26"

  - term: 充要條件
    english: Necessary and Sufficient
    slug: necessary-and-sufficient
    category: logic
    origin: 邏輯學、數學
    meaning: 必要條件（缺它不成立）加上充分條件（有它即成立）
    prompt_usage: 要求 AI 區分「沒有它不行」和「有它就夠」、不要混為一談
    short_usage: 要求區分必要與充分不要混談
    example: 請列出達成這個目標的**充要條件**，分別說明必要與充分的部分。
    added: "2026-05-26"
    last_verified: "2026-05-26"

  - term: 第一性原理
    english: First Principles
    slug: first-principles
    category: logic
    origin: 哲學（亞里斯多德）、物理學
    source:
      name: SEP - Aristotle's Metaphysics
      url: https://plato.stanford.edu/entries/aristotle-metaphysics/
    meaning: 從不可再分割的基本事實出發推理、不依賴類比
    prompt_usage: 要求 AI 拋開既有方案、從根本需求重新思考
    short_usage: 要求拋開既有方案從根本重思
    example: 請用**第一性原理**重新分析這個架構，不要參考既有的業界做法。
    added: "2026-05-26"
    last_verified: "2026-05-26"

  - term: 命題
    english: Proposition
    slug: proposition
    category: logic
    origin: 邏輯學
    meaning: 可以判定為真或假的陳述句
    prompt_usage: 要求 AI 把模糊主張轉成可判真假的明確命題
    short_usage: 要求把模糊主張轉為可判真假句
    example: 請把這段論述拆成數個獨立**命題**，每一個都可以單獨判定真假。
    added: "2026-05-26"
    last_verified: "2026-05-26"

  - term: 奧坎剃刀
    english: Occam's Razor
    slug: occams-razor
    category: logic
    origin: 中世紀邏輯學（William of Ockham）
    source:
      name: SEP - Simplicity
      url: https://plato.stanford.edu/entries/simplicity/
    meaning: 若無必要、勿增實體；同等解釋力下選最簡假設
    prompt_usage: 要求 AI 在多個解釋中選最簡單的、不要過度推測
    short_usage: 要求在多解釋中挑最簡的
    example: 請用**奧坎剃刀**原則篩選這幾個假設，留下最簡單而仍能解釋現象的那個。
    added: "2026-05-26"
    last_verified: "2026-05-26"

  - term: 悖論
    english: Paradox
    slug: paradox
    category: logic
    origin: 邏輯學、哲學
    meaning: 表面合理推理卻導出矛盾或不可接受結論的陳述
    prompt_usage: 要求 AI 主動指出方案中的自相矛盾之處
    short_usage: 要求指出方案中的自相矛盾
    example: 請檢查這份設計是否存在**悖論**，有沒有條件互相打架的地方。
    added: "2026-05-26"
    last_verified: "2026-05-26"

  - term: 演繹
    english: Deduction
    slug: deduction
    category: logic
    origin: 邏輯學
    meaning: 從一般原則推出特定結論、結論必然為真
    prompt_usage: 要求 AI 從已給原則嚴格推出、不要靠經驗或舉例
    short_usage: 要求從已給原則嚴格推出結論
    example: 請用**演繹**方式從前述三條原則推出結論，不要引用其他案例。
    added: "2026-05-26"
    last_verified: "2026-05-26"

  - term: 蘊含
    english: Implication
    slug: implication
    category: logic
    origin: 邏輯學
    meaning: 若 A 則 B 的條件關係
    prompt_usage: 要求 AI 明確標示「因此」「則」的邏輯連結、不要含糊
    short_usage: 要求標明每步的因此或則
    example: 請把這段推理的**蘊含**關係標示清楚，每一步都標出「因此」。
    added: "2026-05-26"
    last_verified: "2026-05-26"

  - term: 假設
    english: Hypothesis
    slug: hypothesis
    category: logic
    origin: 科學方法
    meaning: 可被驗證或推翻的暫時性主張
    prompt_usage: 要求 AI 把判斷講成可驗證的假設、而非斷言
    short_usage: 要求把判斷講成可驗證的假設
    example: 請把你的判斷改寫成可驗證的**假設**，並指出如何驗證它。
    added: "2026-05-26"
    last_verified: "2026-05-26"

  - term: 前提
    english: Premise
    slug: premise
    category: logic
    origin: 邏輯學
    meaning: 推理所依據的起始陳述
    prompt_usage: 要求 AI 明確列出論證所依賴的所有前提
    short_usage: 要求先列出論證依賴的起始陳述
    example: 請先列出這個結論所依賴的**前提**，再開始推理。
    added: "2026-05-26"
    last_verified: "2026-05-26"

  - term: 等價
    english: Equivalence
    slug: equivalence
    category: logic
    origin: 邏輯學、數學
    meaning: 兩個陳述彼此互相蘊含、真假同步
    prompt_usage: 要求 AI 判斷兩個說法是否真的同義、或找出兩者的等價形式
    short_usage: 要求判斷兩說法是否真同義
    example: 請判斷這兩個敘述是否**等價**，若不等價請指出差異。
    added: "2026-05-26"
    last_verified: "2026-05-26"

  - term: 歸納
    english: Induction
    slug: induction
    category: logic
    origin: 邏輯學、科學方法
    meaning: 從多個個案歸結出一般規律
    prompt_usage: 要求 AI 從具體案例中抽出通則、而非直接給結論
    short_usage: 要求從多案例抽出通則
    example: 請從這五個案例**歸納**出共通模式，再給出一般性結論。
    added: "2026-05-26"
    last_verified: "2026-05-26"

  - term: 邊界條件
    english: Boundary Condition
    slug: boundary-condition
    category: logic
    origin: 數學、物理、軟體測試
    meaning: 適用範圍的臨界值或限制條件
    prompt_usage: 要求 AI 明確界定方案在什麼情況下成立、超出何時失效
    short_usage: 要求界定方案的適用臨界值
    example: 請列出這個建議的**邊界條件**，超過哪些情況就不再適用。
    added: "2026-05-26"
    last_verified: "2026-05-26"

  # ===== 三、思考與認知 =====
  - term: 元認知
    english: Metacognition
    slug: metacognition
    category: cognition
    origin: 認知心理學（Flavell, 1979）
    meaning: 對自己思考過程的覺察與監控
    prompt_usage: 要求 AI 邊回答邊反思自己的推理品質與限制
    short_usage: 要求邊回答邊反思推理品質
    example: 請啟動**元認知**：每段回答後簡述你做了什麼推理、哪裡可能出錯。
    added: "2026-05-26"
    last_verified: "2026-05-26"

  - term: 反向推理
    english: Backward Reasoning
    slug: backward-reasoning
    category: cognition
    origin: 認知科學、解題理論
    meaning: 從目標往回推、找出達成所需的前置條件
    prompt_usage: 要求 AI 從結果出發倒推所需步驟、而非從現狀出發
    short_usage: 要求從目標倒推所需步驟
    example: 請用**反向推理**從目標倒推步驟，列出每一步的必要前置條件。
    added: "2026-05-26"
    last_verified: "2026-05-26"

  - term: 心智模型
    english: Mental Model
    slug: mental-model
    category: cognition
    origin: 認知科學（Craik, 1943）
    meaning: 人對事物運作機制的內在表徵
    prompt_usage: 要求 AI 先講清楚它如何理解整件事、再開始細節
    short_usage: 要求先講清楚如何理解整件事
    example: 請先描述你對這個系統的**心智模型**，再回答具體問題。
    added: "2026-05-26"
    last_verified: "2026-05-26"

  - term: 收斂思考
    english: Convergent Thinking
    slug: convergent-thinking
    category: cognition
    origin: 認知心理學（Guilford, 1956）
    meaning: 從多個選項中聚焦到單一最佳答案的思考方式
    prompt_usage: 要求 AI 從候選方案中挑出唯一推薦、不要繼續發散
    short_usage: 要求從候選中挑唯一推薦
    example: 請進入**收斂思考**模式，從前面列出的五個方案中挑出唯一推薦。
    added: "2026-05-26"
    last_verified: "2026-05-26"

  - term: 框架
    english: Framework
    slug: framework
    category: cognition
    origin: 認知科學、管理學
    meaning: 用來組織思考的結構化視角
    prompt_usage: 要求 AI 套用某個既有框架分析、或先建立分析框架再展開
    short_usage: 要求先建立分析結構再展開
    example: 請先建立分析**框架**，再用此框架逐項檢視這個提案。
    added: "2026-05-26"
    last_verified: "2026-05-26"

  - term: 模式識別
    english: Pattern Recognition
    slug: pattern-recognition
    category: cognition
    origin: 認知科學、機器學習
    meaning: 從雜訊中辨識出重複出現的結構
    prompt_usage: 要求 AI 從一堆案例中找出共通模式、而非逐案分析
    short_usage: 要求從案例中找共通模式
    example: 請在這 20 筆事件中做**模式識別**，找出反覆出現的根因類型。
    added: "2026-05-26"
    last_verified: "2026-05-26"

  - term: 範疇化
    english: Categorization
    slug: categorization
    category: cognition
    origin: 認知語言學（Rosch, 1973）
    meaning: 將個體歸入類別以便處理
    prompt_usage: 要求 AI 先把雜亂項目分類、再針對類別處理
    short_usage: 要求先把雜亂項目分類再處理
    example: 請先對這份清單做**範疇化**，分成 3-5 組再各組給建議。
    added: "2026-05-26"
    last_verified: "2026-05-26"

  - term: 思考鏈
    english: Chain of Thought
    slug: chain-of-thought
    category: cognition
    origin: 認知科學（已跨界普及為 LLM 術語）
    source:
      name: Wei et al., "Chain-of-Thought Prompting Elicits Reasoning in Large Language Models" (arXiv:2201.11903, 2022)
      url: https://arxiv.org/abs/2201.11903
    meaning: 把推理過程逐步外顯、而非只給結論
    prompt_usage: 要求 AI 展示完整推理步驟、不要跳到結論
    short_usage: 要求展示完整推理步驟
    example: 請用**思考鏈**方式回答，每一步推理都明寫出來。
    added: "2026-05-26"
    last_verified: "2026-05-26"

  - term: 系統思考
    english: Systems Thinking
    slug: systems-thinking
    category: cognition
    origin: 管理學（Senge）、控制論
    meaning: 從整體關係與回饋環路看問題、而非孤立元素
    prompt_usage: 要求 AI 考慮元素間的回饋與長期動態、不要只看單點
    short_usage: 要求考慮回饋環與長期動態
    example: 請以**系統思考**檢視這個方案，找出可能的回饋環與長期副作用。
    added: "2026-05-26"
    last_verified: "2026-05-26"

  - term: 抽象化
    english: Abstraction
    slug: abstraction
    category: cognition
    origin: 哲學、計算機科學
    meaning: 去除具體細節、保留共通本質
    prompt_usage: 要求 AI 把具體案例提升為通則
    short_usage: 要求把案例提升為通則
    example: 請對這三個案例做**抽象化**，提煉出可應用於其他情境的通則。
    added: "2026-05-26"
    last_verified: "2026-05-26"

  - term: 具象化
    english: Concretization
    slug: concretization
    category: cognition
    origin: 認知科學、教學設計
    meaning: 把抽象概念落實為具體案例或畫面
    prompt_usage: 要求 AI 把空泛敘述換成可想像的具體場景
    short_usage: 要求把空泛敘述換成具體場景
    example: 請把這段抽象描述**具象化**，給出一個讀者可想像的具體場景。
    added: "2026-05-26"
    last_verified: "2026-05-26"

  - term: 發散思考
    english: Divergent Thinking
    slug: divergent-thinking
    category: cognition
    origin: 認知心理學（Guilford, 1956）
    meaning: 從單一起點生成多個可能方向的思考方式
    prompt_usage: 要求 AI 先大量產出選項、暫不評價
    short_usage: 要求先大量產出選項暫不評價
    example: 請先做**發散思考**列出至少十種可能做法，暫不評估優劣。
    added: "2026-05-26"
    last_verified: "2026-05-26"

  - term: 層次化
    english: Hierarchization
    slug: hierarchization
    category: cognition
    origin: 認知科學、系統設計
    meaning: 將事物依抽象/重要程度分層組織
    prompt_usage: 要求 AI 把扁平清單轉成有層級結構的樹狀組織
    short_usage: 要求把扁平清單轉為樹狀結構
    example: 請把這 30 條重點**層次化**，分成主類、次類、細項三層。
    added: "2026-05-26"
    last_verified: "2026-05-26"

  - term: 類比
    english: Analogy
    slug: analogy
    category: cognition
    origin: 認知科學、修辭學
    meaning: 藉由結構相似性把已知概念對應到未知領域
    prompt_usage: 要求 AI 用熟悉的事物來說明陌生概念
    short_usage: 要求用熟悉事物說明陌生概念
    example: 請用一個日常生活的**類比**說明這個技術概念。
    added: "2026-05-26"
    last_verified: "2026-05-26"

  - term: 隱喻
    english: Metaphor
    slug: metaphor
    category: cognition
    origin: 認知語言學（Lakoff & Johnson）
    meaning: 用 A 概念來理解 B 概念、不是修辭裝飾而是認知工具
    prompt_usage: 要求 AI 找一個強而有力的隱喻來貫穿整段說明
    short_usage: 要求找一個強力隱喻貫穿說明
    example: 請為這個複雜系統找一個一以貫之的**隱喻**，讓讀者一句話就懂。
    added: "2026-05-26"
    last_verified: "2026-05-26"

  # ===== 四、語言與表達 =====
  - term: 口語化
    english: Colloquialization
    slug: colloquial
    category: language
    origin: 語言學、修辭學
    meaning: 把書面/專業文體轉為日常對話風格
    prompt_usage: 要求 AI 把生硬文字改成自然口吻、像在對人說話
    short_usage: 要求改成自然對話的語氣
    example: 請把這段技術文件**口語化**，改成像對同事口頭說明的語氣。
    added: "2026-05-26"
    last_verified: "2026-05-26"

  - term: 排比
    english: Parallelism
    slug: parallelism
    category: language
    origin: 修辭學
    meaning: 用相同句式串接多項、強化節奏與比較
    prompt_usage: 要求 AI 用結構一致的句式呈現並列項目
    short_usage: 要求用一致句式呈現並列項
    example: 請用**排比**句式重寫這三個重點，讓讀者一眼看出對應關係。
    added: "2026-05-26"
    last_verified: "2026-05-26"

  - term: 修辭
    english: Rhetoric
    slug: rhetoric
    category: language
    origin: 古典修辭學
    meaning: 為達成說服或感染效果而調整的語言策略
    prompt_usage: 要求 AI 強化或弱化修辭、調整說服力強度
    short_usage: 要求調整說服力強度
    example: 請降低這段文案的**修辭**強度，改成中性客觀的描述。
    added: "2026-05-26"
    last_verified: "2026-05-26"

  - term: 重組
    english: Reorganization
    slug: restructuring
    category: language
    origin: 寫作學、編輯學
    meaning: 保留資訊但重新安排呈現順序與結構
    prompt_usage: 要求 AI 不增刪內容、只調整段落順序與切分
    short_usage: 要求不增刪只調整段落順序
    example: 請**重組**這篇草稿，不要增刪任何資訊、只調整段落順序讓邏輯更清楚。
    added: "2026-05-26"
    last_verified: "2026-05-26"

  - term: 結構化
    english: Structurization
    slug: structuring
    category: language
    origin: 寫作學、資訊架構
    meaning: 把散亂內容轉為有層次、可導覽的形式
    prompt_usage: 要求 AI 用標題、條列、表格組織輸出
    short_usage: 要求加標題條列表格組織
    example: 請把這段散文**結構化**，加上標題、條列與必要的表格。
    added: "2026-05-26"
    last_verified: "2026-05-26"

  - term: 對比
    english: Contrast
    slug: contrast
    category: language
    origin: 修辭學、寫作學
    meaning: 將兩個事物並列以突顯差異
    prompt_usage: 要求 AI 用「A vs B」的格式呈現比較、而非分述
    short_usage: 要求用 A vs B 並列呈現差異
    example: 請用**對比**手法呈現新舊方案差異，並列陳述每個維度。
    added: "2026-05-26"
    last_verified: "2026-05-26"

  - term: 精煉
    english: Refinement
    slug: refinement
    category: language
    origin: 寫作學、編輯學
    meaning: 刪去冗餘、保留核心、提升密度
    prompt_usage: 要求 AI 砍掉廢話、把長文壓縮到剩本質
    short_usage: 要求砍掉冗餘只留本質
    example: 請**精煉**這份報告到三分之一長度，只保留決策必要的資訊。
    added: "2026-05-26"
    last_verified: "2026-05-26"

  - term: 語域
    english: Register
    slug: register
    category: language
    origin: 社會語言學（Halliday）
    meaning: 依場合調整的語言層次（正式/非正式/技術/通俗）
    prompt_usage: 要求 AI 切換到指定語域、不要混用
    short_usage: 要求切換到指定的正式層次
    example: 請用適合對高階主管的正式**語域**改寫這封信。
    added: "2026-05-26"
    last_verified: "2026-05-26"

  - term: 語境
    english: Context
    slug: context
    category: language
    origin: 語言學、語用學
    meaning: 話語發生的情境、上下文與背景知識
    prompt_usage: 要求 AI 先確認語境再回答、不要脫離情境給通用建議
    short_usage: 要求先確認情境再回答
    example: 請先釐清這個問題的**語境**（誰問、為何問、給誰看），再給建議。
    added: "2026-05-26"
    last_verified: "2026-05-26"

  - term: 潤飾
    english: Polishing
    slug: polishing
    category: language
    origin: 寫作學
    meaning: 修整語句通順度與用詞但不動結構與內容
    prompt_usage: 要求 AI 只改文字流暢度、不要改原意或結構
    short_usage: 要求只改通順度不動結構
    example: 請**潤飾**這段文字，只修語句通順度，保留原意與段落結構。
    added: "2026-05-26"
    last_verified: "2026-05-26"

  - term: 擴寫
    english: Expansion
    slug: expansion
    category: language
    origin: 寫作學
    meaning: 從綱要或短句延展為完整段落
    prompt_usage: 要求 AI 把要點展開為敘述、補上脈絡與例證
    short_usage: 要求把要點展開為完整段落
    example: 請把這份大綱**擴寫**為完整段落，每個要點補上脈絡與一個例證。
    added: "2026-05-26"
    last_verified: "2026-05-26"

  - term: 降噪
    english: Denoising
    slug: denoising
    category: language
    origin: 訊號處理、機器學習
    meaning: 去除無關訊息、突顯核心訊號
    prompt_usage: 要求 AI 從一大堆雜訊資料中濾出真正關鍵的部分
    short_usage: 要求濾出真正關鍵的部分
    example: 請對這份會議逐字稿做**降噪**，只留下與決策相關的發言。
    added: "2026-05-26"
    last_verified: "2026-05-26"

  # ===== 五、品質與檢查 =====
  - term: 一致性
    english: Consistency
    slug: consistency
    category: quality
    origin: 資料庫理論（ACID）、品質保證
    meaning: 前後不矛盾、命名/格式/語氣統一
    prompt_usage: 要求 AI 檢查文件內前後是否打架、用詞是否統一
    short_usage: 要求檢查前後是否矛盾用詞是否統一
    example: 請檢查這份文件的**一致性**，找出前後矛盾或用詞不統一之處。
    added: "2026-05-26"
    last_verified: "2026-05-26"

  - term: 反例測試
    english: Counterexample Testing
    slug: counterexample-testing
    category: quality
    origin: 形式驗證、軟體測試
    meaning: 主動構造能推翻主張的案例來驗證強度
    prompt_usage: 要求 AI 不只驗證正例、要主動構造能戳破的反例
    short_usage: 要求主動構造能戳破結論的場景
    example: 請對這個結論做**反例測試**，主動構造能戳破它的場景。
    added: "2026-05-26"
    last_verified: "2026-05-26"

  - term: 反脆弱性
    english: Antifragility
    slug: antifragility
    category: quality
    origin: Nassim Taleb《反脆弱》
    source:
      name: Nassim Taleb, Antifragile (Random House, 2012)
      url: https://en.wikipedia.org/wiki/Antifragility
    meaning: 在壓力與不確定下變得更強的特質（不只是抗壓、是受益）
    prompt_usage: 要求 AI 設計的方案能因例外/失敗變得更好、而不只是不崩
    short_usage: 要求方案遇例外能變更穩健
    example: 請以**反脆弱性**為設計目標，這個流程遇到例外時應該變得更穩健而不是退化。
    added: "2026-05-26"
    last_verified: "2026-05-26"

  - term: 可重複性
    english: Repeatability
    slug: repeatability
    category: quality
    origin: 計量學、實驗科學
    meaning: 同一人同一條件多次執行得到一致結果
    prompt_usage: 要求 AI 的步驟自己跑兩次也要結果一致、不要看心情
    short_usage: 要求自己跑兩次也要結果一致
    example: 請確保這份流程的**可重複性**，同一人照做兩次結果必須一致。
    added: "2026-05-26"
    last_verified: "2026-05-26"

  - term: 可驗證性
    english: Verifiability
    slug: verifiability
    category: quality
    origin: 哲學（Popper）、品質保證
    meaning: 主張可被獨立檢查為真或為假
    prompt_usage: 要求 AI 給出的每個結論都附上可查證的依據
    short_usage: 要求每個結論附可查證的依據
    example: 請確保每個結論的**可驗證性**，附上能讓第三方查證的來源或測試方法。
    added: "2026-05-26"
    last_verified: "2026-05-26"

  - term: 完備性
    english: Completeness
    slug: completeness
    category: quality
    origin: 邏輯學、形式系統
    meaning: 涵蓋所有應處理的情況、無遺漏
    prompt_usage: 要求 AI 檢查是否所有案例都已處理、不要漏邊角
    short_usage: 要求檢查是否所有案例都已涵蓋
    example: 請檢查這份規格的**完備性**，列出尚未涵蓋的邊角情況。
    added: "2026-05-26"
    last_verified: "2026-05-26"

  - term: 盲點檢查
    english: Blind Spot Check
    slug: blind-spot-check
    category: quality
    origin: 認知偏誤研究、稽核實務
    meaning: 主動尋找自己沒看到、不會想到的角度
    prompt_usage: 要求 AI 跳出當前框架、設想自己漏掉了什麼
    short_usage: 要求設想自己漏掉了什麼
    example: 請對這份計畫做**盲點檢查**，提出三個我可能完全沒想到的風險。
    added: "2026-05-26"
    last_verified: "2026-05-26"

  - term: 穩健性
    english: Robustness
    slug: robustness
    category: quality
    origin: 統計學、控制理論
    meaning: 在輸入有雜訊或偏離預期時仍維持表現
    prompt_usage: 要求 AI 的方案在輸入不理想時也要能撐住
    short_usage: 要求輸入不理想時也能撐住
    example: 請評估這個流程的**穩健性**，若輸入有缺漏或格式錯誤會發生什麼。
    added: "2026-05-26"
    last_verified: "2026-05-26"

  - term: 健全性
    english: Soundness
    slug: soundness
    category: quality
    origin: 邏輯學、形式驗證
    meaning: 前提為真且推理有效、結論必然為真
    prompt_usage: 要求 AI 檢查論證是否「前提真且推理對」、而非只看結論順眼
    short_usage: 要求核對前提真實且推理有效
    example: 請檢查這段推論的**健全性**，逐一核對前提是否真實、推理是否有效。
    added: "2026-05-26"
    last_verified: "2026-05-26"

  - term: 雙重檢查
    english: Double Check
    slug: double-check
    category: quality
    origin: 航空、醫療、品質保證
    meaning: 用獨立第二種方法重做一次以發現第一次的錯
    prompt_usage: 要求 AI 給完答案再用另一種方式重算/重推一次
    short_usage: 要求用另一種方法重新推導一次
    example: 請對這個答案做**雙重檢查**，用另一種獨立方法重新推導一次。
    added: "2026-05-26"
    last_verified: "2026-05-26"

  - term: 漏洞檢查
    english: Vulnerability Check
    slug: vulnerability-check
    category: quality
    origin: 資訊安全、稽核
    meaning: 主動尋找可被濫用或失效的脆弱點
    prompt_usage: 要求 AI 從攻擊者/濫用者視角找出弱點
    short_usage: 要求從濫用者視角找弱點
    example: 請對這份規則做**漏洞檢查**，從會鑽漏洞的人的角度找出可被繞過之處。
    added: "2026-05-26"
    last_verified: "2026-05-26"

  - term: 邊界測試
    english: Boundary Testing
    slug: boundary-testing
    category: quality
    origin: 軟體測試
    meaning: 在輸入範圍的臨界值上特別驗證
    prompt_usage: 要求 AI 特別處理極端值、零值、上限、空值等情境
    short_usage: 要求特別說明極端值與空值行為
    example: 請對這個方案做**邊界測試**，特別說明在零、極大、空輸入時的行為。
    added: "2026-05-26"
    last_verified: "2026-05-26"

  - term: 錨定
    english: Anchoring
    slug: anchoring
    category: cognition
    origin: 行為經濟學、Tversky & Kahneman (1974)
    source:
      name: APA Dictionary of Psychology
      url: https://dictionary.apa.org/anchoring
    meaning: 對第一個收到的資訊賦予過高權重、後續判斷以此為基準
    prompt_usage: 主動給 AI 一個參照點作為起算基準、或要求 AI 警覺自己是否被前文錨定
    short_usage: 給 AI 一個參照點作為基準
    example: 請以**錨定**到本季 KPI 為起點，後續所有提案都對齊這個基準評估。
    added: "2026-05-26"
    last_verified: "2026-05-26"

  - term: 確認偏誤
    english: Confirmation Bias
    slug: confirmation-bias
    category: cognition
    origin: 認知心理學、Wason (1960)
    source:
      name: APA Dictionary of Psychology
      url: https://dictionary.apa.org/confirmation-bias
    meaning: 偏好支持既有信念的資訊、忽略反證
    prompt_usage: 要求 AI 主動找反證、或檢查論述是否只挑符合假設的資料
    short_usage: 要求找反證避免單一視角
    example: 請檢查這份報告是否存在**確認偏誤**，列出三個與結論相反的證據。
    added: "2026-05-26"
    last_verified: "2026-05-26"

  - term: 認知負荷
    english: Cognitive Load
    slug: cognitive-load
    category: cognition
    origin: Sweller (1988) 認知負荷理論
    source:
      name: APA Dictionary of Psychology
      url: https://dictionary.apa.org/cognitive-load
    meaning: 工作記憶在處理資訊時承受的心智壓力
    prompt_usage: 要求 AI 降低輸出的閱讀難度、控制每段資訊密度
    short_usage: 要求降低閱讀難度與資訊密度
    example: 請以低**認知負荷**為設計目標，每段落只解釋一個概念、術語首次出現必附簡釋。
    added: "2026-05-26"
    last_verified: "2026-05-26"

  - term: 辯證法
    english: Dialectic
    slug: dialectic
    category: logic
    origin: 古希臘哲學、Hegel《邏輯學》
    source:
      name: Stanford Encyclopedia of Philosophy - Hegel's Dialectics
      url: https://plato.stanford.edu/entries/hegel-dialectics/
    meaning: 透過正論、反論、合論的對立統一推進思考
    prompt_usage: 要求 AI 用「正論 → 反論 → 合論」三段式結構分析議題
    short_usage: 要求正反合三段式分析
    example: 請用**辯證法**結構分析這個議題：先列支持論點、再列反對論點、最後綜合出折衷方案。
    added: "2026-05-26"
    last_verified: "2026-05-26"

  - term: 驗收標準
    english: Acceptance Criteria
    slug: acceptance-criteria
    category: quality
    origin: 敏捷開發、需求工程
    meaning: 一個交付物被視為「完成」所必須符合的具體可驗證條件
    prompt_usage: 要求 AI 在開始任務前先明確產出的判定條件、避免做完才發現不對
    short_usage: 要求先講明「怎樣才算做完」
    example: 請先列出這份報告的**驗收標準**（至少 5 條可驗證），確認後再開始撰寫。
    added: "2026-05-26"
    last_verified: "2026-05-26"

  - term: 校準
    english: Calibration
    slug: calibration
    category: cognition
    origin: 心理計量、決策科學
    source:
      name: APA Dictionary of Psychology
      url: https://dictionary.apa.org/calibration
    meaning: 讓主觀判斷與實際結果對齊的調整過程
    prompt_usage: 要求 AI 依證據強度調整結論信心，並明示不確定範圍
    short_usage: 要求依證據強度調整信心並註明不確定
    example: 請對你的結論做**校準**，高不確定段落要降語氣並標示依據不足處。
    added: "2026-05-27"
    last_verified: "2026-05-27"

  - term: 可追溯性
    english: Traceability
    slug: traceability
    category: quality
    origin: 需求工程、品質管理
    meaning: 結果能回溯到來源與決策依據的能力
    prompt_usage: 要求 AI 讓每項結論對應來源、需求或步驟，保留稽核路徑
    short_usage: 要求結論可回溯到來源與步驟
    example: 請以**可追溯性**整理此提案，每個結論後都標註對應依據與決策步驟。
    added: "2026-05-27"
    last_verified: "2026-05-27"

  # Owner 核准破例（2026-06-24）：Claude 產品功能，非借詞，但收錄。詳見 AGENTS.md §1。
  - term: 成品
    english: Artifact
    slug: artifact
    category: structure
    origin: Anthropic Claude 產品功能（2024）
    source:
      name: Claude Help Center - What are artifacts and how do I use them?
      url: https://support.claude.com/en/articles/9487310-what-are-artifacts-and-how-do-i-use-them
    meaning: 把 AI 產出渲染成獨立、可即時瀏覽與分享的 claude.ai 頁面
    prompt_usage: 要求 AI 把成果做成自包含、可即時預覽與分享的獨立頁面、而非只給對話內純文字
    short_usage: 要求把成果做成可分享的獨立頁面
    example: 請把這份報表做成 **成品**（Artifact），獨立成可即時瀏覽、可分享的頁面。
    added: "2026-06-24"
    last_verified: "2026-06-24"
